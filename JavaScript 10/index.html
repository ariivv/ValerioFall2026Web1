<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Welcome to my cookie jar</title>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- import the webpage's stylesheet -->
		<link rel="stylesheet" href="styles.css" />
		<!-- import the webpage's JavaScript file -->
		<script src="script.js" defer></script>
	</head>

	<body>
		<div id="page">
			<h1>Christmas Cookie Jar</h1>
			<div id="left-container" class="container">
				<div class="cookie-holder">
					<img class="Cookie" alt="cookie" id="cookie1" src="images/cookie1.png" />
				</div>
				<div class="cookie-holder">
					<img class="Cookie" alt="cookie" id="cookie2" src="images/cookie2.png" />
				</div>
				<div class="cookie-holder">
					<img class="Cookie" alt="cookie" id="cookie3" src="images/cookie3.png" />
				</div>
			</div>
			<div id="right-container" class="container">
				<div class="cookie-holder">
					<img class="Cookie" alt="cookie" id="cookie4" src="images/cookie5.png" />
				</div>
				<div class="cookie-holder">
					<img class="Cookie" alt="cookie" id="cookie5" src="images/cookie6.png" />
				</div>
				<div class="cookie-holder">
					<img class="Cookie" alt="cookie" id="cookie6" src="images/cookie7.png" />
				</div> 
			</div>

			<div id="terrarium">
				<div class="jar-top"></div>
				<div class="jar-walls">
					<div class="jar-glossy-long"></div>
					<div class="jar-glossy-short"></div>
				</div>
				<div class="dirt"></div>
				<div class="jar-bottom"></div>
			</div>
		</div>
	</body>
</html>
